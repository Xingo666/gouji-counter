name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: gouji-counter

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (Release)
        run: |
          xcodebuild \
            -project GoujiCardCounter.xcodeproj \
            -scheme GoujiCardCounter \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_IDENTITY="" \
            build
        working-directory: gouji-counter

      - name: Create IPA structure
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/GoujiCardCounter.app"
          PAYLOAD_DIR="ipa/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          # 移除 CodeSignature（AltStore 会重新签名）
          rm -rf "$PAYLOAD_DIR/GoujiCardCounter.app/_CodeSignature"
          rm -f "$PAYLOAD_DIR/GoujiCardCounter.app/embedded.mobileprovision"

          # 检查扩展
          ls -la "$PAYLOAD_DIR/GoujiCardCounter.app/PlugIns/" || echo "No plugins found"

          cd ipa
          zip -r ../GoujiCardCounter.ipa .
          cd ..
          ls -lh GoujiCardCounter.ipa
        working-directory: gouji-counter

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GoujiCardCounter.ipa
          path: gouji-counter/GoujiCardCounter.ipa

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: GoujiCardCounter.app
          path: gouji-counter/build/Build/Products/Release-iphoneos/GoujiCardCounter.app
